                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/authentication.service.v1.RegisterUserResponse'
            security:
                - {}
    /app/v1/reset-password:
        post:
            tags:
                - AuthenticationService
            description: |-
                校验验证码并重置密码
                 校验 Redis 中的验证码（校验即删，一次性），通过后按邮箱反查用户名，
                 调用核心 ResetCredential 重置 USERNAME 凭证（注册时仅创建 USERNAME 凭证）。
            operationId: AuthenticationService_ResetPassword
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/app.service.v1.ResetPasswordRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content: {}
            security:
                - {}
    /app/v1/send-reset-code:
        post:
            tags:
                - AuthenticationService
            description: |-
                发送密码重置验证码到邮箱
                 生成 6 位数字验证码，存 Redis（TTL），并通过 SMTP 发送。
                 未配置 SMTP 时降级为日志输出（便于开发/演示），流程仍可端到端验证。
            operationId: AuthenticationService_SendResetCode
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/app.service.v1.SendResetCodeRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/app.service.v1.SendResetCodeResponse'
            security:
                - {}
