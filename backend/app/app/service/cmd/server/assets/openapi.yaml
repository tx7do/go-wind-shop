                    description: 预签名上传链接
        wishlist.service.v1.CreateWishlistRequest:
            type: object
            properties:
                data:
                    $ref: '#/components/schemas/wishlist.service.v1.Wishlist'
        wishlist.service.v1.ListWishlistResponse:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/wishlist.service.v1.Wishlist'
                total:
                    type: string
        wishlist.service.v1.Wishlist:
            type: object
            properties:
                id:
                    type: integer
                    description: 收藏项ID
                    format: uint32
                userId:
                    type: integer
                    description: 用户ID（由隐私层强制，不可伪造）
                    format: uint32
                productId:
                    type: integer
                    description: 关联的商品ID
                    format: uint32
                tenantId:
                    type: integer
                    description: 租户ID
                    format: uint32
                createdBy:
                    type: integer
                    description: 创建者用户ID
                    format: uint32
                updatedBy:
                    type: integer
                    description: 更新者用户ID
                    format: uint32
                deletedBy:
                    type: integer
                    description: 删除者用户ID
                    format: uint32
                createdAt:
                    type: string
                    description: 创建时间
                    format: date-time
                updatedAt:
                    type: string
                    description: 更新时间
                    format: date-time
                deletedAt:
                    type: string
                    description: 删除时间
                    format: date-time
            description: 收藏项
    responses:
        default:
            description: default kratos response
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/KratosStatus'
    securitySchemes:
        OAuth2PasswordBearer:
            type: oauth2
            flows:
                password:
                    tokenUrl: /admin/v1/login
                    refreshUrl: /admin/v1/refresh-token
                    scopes: {}
security:
    - OAuth2PasswordBearer: []
tags:
    - name: AuthenticationService
      description: 用户前台登录认证服务
    - name: BrandService
      description: 品牌前台服务
    - name: CartItemService
      description: 购物车项前台服务
    - name: CartService
      description: 购物车前台服务
    - name: CategoryService
      description: 商品类目前台服务
    - name: CommentService
      description: |-
        商品评论前台服务。
         List/Get 在 BFF 层过滤 STATUS_APPROVED（未审核/拒绝/垃圾对前台不可见）；
         Create 注入 CreatedBy（防作者伪造）；Update/Delete 做 ensureCommentOwner（IDOR 防护）。
         评论为公开内容，仅由 TenantPrivacy 做租户隔离（同租户内可见），
         不挂 UserPrivacy（详见 core Comment schema 文档）。
    - name: FileTransferService
      description: 文件传输服务
    - name: InteractionService
      description: |-
        交互服务（评论点赞）。
         Like/Unlike/GetInteractionStatus 需登录（rest_server 白名单刻意不登记，强制走鉴权中间件）。
         仅 GetCounts（公开计数，按 tenant 隔离、不依赖 viewer 身份）登记为白名单。
    - name: InternalMessageRecipientService
      description: |-
        站内信收件箱前台服务（BFF 网关，REST）
         仅暴露收件视角：查收件箱、标记已读、删除。所有操作的 user_id 由网关从登录态
         强制注入，客户端无法读取/操作他人收件箱。
    - name: InvoiceService
      description: |-
        发票前台服务（裁剪写 RPC：仅 List/Get，无 Create/Update/Delete）。
         用户隔离由 BFF fail-closed 注入 user_id + core UserPrivacy 行级隔离双重保障。
         用户不能自己开发票，只能查看自己订单的发票。
    - name: OrderItemService
      description: 订单项前台服务
    - name: OrderService
      description: 订单前台服务
    - name: PaymentRefundService
      description: 支付退款前台服务
    - name: PaymentTransactionService
      description: 支付流水前台服务
    - name: ProductAttributeService
      description: 商品属性前台服务
    - name: ProductAttributeValueService
      description: 商品属性值前台服务
    - name: ProductService
      description: 商品前台服务
    - name: ShipmentService
      description: |-
        物流单前台服务（app 侧，买家只读查询自己订单的物流轨迹）
         仅暴露 List/Get，无 Create/Update/Delete。
    - name: ShippingAddressService
      description: |-
        收货地址前台服务（BFF 网关，REST）
         写操作由网关层强制注入当前登录用户的 user_id/tenant_id，客户端无法伪造。
    - name: SkuAttributeCombinationService
      description: SKU 属性组合前台服务
    - name: SkuPriceService
      description: SKU 价格前台服务
    - name: SkuService
      description: SKU 前台服务
    - name: UserCouponService
      description: "用户优惠券前台服务（裁剪写 RPC：仅 List/Get/Quote，无 Create/Update/Delete）。\r\n 用户隔离由 BFF fail-closed 注入 user_id + core UserPrivacy 行级隔离双重保障。\r\n Quote 试算不持锁不落库，最终抵扣以下单时事务内校验为准。"
    - name: UserProfileService
      description: 用户个人资料服务
    - name: WishlistService
      description: |-
        收藏夹前台服务（裁剪版：仅 List/Create/Delete）。
         user_id 由后端 UserPrivacy 隐私层强制，客户端不可伪造。
