server:
  rest:
    # 10600/10601/10700/10701：避免与兄妹项目（go-wind-cms/erp/oa/kanban/ledger 默认 6600/6601/6700/6701）冲突
    addr: "0.0.0.0:10600"
    # LLM 链路（对话/问数/生成）单轮可达数十秒，全局超时放宽
    timeout: 300s
    enable_swagger: true
    cors:
      headers:
        - "X-Requested-With"
        - "X-Request-ID"
        - "Content-Type"
        - "Authorization"
        - "X-Captcha-Id"
        - "X-Captcha-Value"
      methods:
        - "GET"
        - "POST"
        - "PUT"
        - "DELETE"
        - "HEAD"
        - "OPTIONS"
      origins:
        - "*"
    middleware:
      auth:
        method: "HS256"
        key: "some_api_key"

  sse:
    addr: ":10601"
    codec: "json"
    path: "/events"
    auto_stream: true
    auto_reply: false

  grpc:
    addr: "0.0.0.0:0"
    # LLM 链路（对话/问数/生成）单轮可达数十秒，全局超时放宽
    timeout: 300s
    middleware:
      enable_logging: true
      enable_recovery: true
      enable_tracing: true
      enable_validate: true
      enable_circuit_breaker: true
      enable_metadata: true

  # asynq Inspector（TaskMonitorService 系统任务巡检只读用；与 core 同一 asynq 专库 db11，
  # 不要用 db1——本机 wms/im 等其他项目的 asynq 也在 db1，会互相抢 asynq:{default} 队列任务）
  asynq:
    uri: "redis://:*Abcd123456@redis:6379/11"
    codec: "json"
