syntax = "proto3";

package address.service.v1;

import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";

import "pagination/v1/pagination.proto";

// 收货地址服务（核心实现，gRPC）
service ShippingAddressService {
  rpc List (pagination.PagingRequest) returns (ListShippingAddressResponse) {}
  rpc Count (pagination.PagingRequest) returns (CountShippingAddressResponse) {}
  rpc Get (GetShippingAddressRequest) returns (ShippingAddress) {}
  rpc Create (CreateShippingAddressRequest) returns (google.protobuf.Empty) {}
  rpc Update (UpdateShippingAddressRequest) returns (google.protobuf.Empty) {}
  rpc Delete (DeleteShippingAddressRequest) returns (google.protobuf.Empty) {}
}

// 收货地址
message ShippingAddress {
  optional uint32 id = 1 [json_name = "id", (gnostic.openapi.v3.property) = {description: "地址ID"}];

  optional uint32 user_id = 2 [json_name = "userId", (gnostic.openapi.v3.property) = {description: "所属用户ID"}];

  optional string recipient_name = 3 [
    json_name = "recipientName",
    (gnostic.openapi.v3.property) = {description: "收件人姓名"}
  ];

  optional string recipient_phone = 4 [
    json_name = "recipientPhone",
    (gnostic.openapi.v3.property) = {description: "收件人电话"}
  ];

  optional string region = 5 [
    json_name = "region",
    (gnostic.openapi.v3.property) = {description: "省/市/区（结构化文本）"}
  ];

  optional string detail_address = 6 [
    json_name = "detailAddress",
    (gnostic.openapi.v3.property) = {description: "详细地址"}
  ];

  optional string postal_code = 7 [
    json_name = "postalCode",
    (gnostic.openapi.v3.property) = {description: "邮政编码"}
  ];

  optional string tag = 8 [
    json_name = "tag",
    (gnostic.openapi.v3.property) = {description: "地址标签（如：家、公司、学校）"}
  ];

  optional bool is_default = 9 [
    json_name = "isDefault",
    (gnostic.openapi.v3.property) = {description: "是否默认地址"}
  ];

  optional uint32 tenant_id = 90 [json_name = "tenantId", (gnostic.openapi.v3.property) = {description: "租户ID"}];

  optional uint32 created_by = 100 [json_name = "createdBy", (gnostic.openapi.v3.property) = {description: "创建者用户ID"}];
  optional uint32 updated_by = 101 [json_name = "updatedBy", (gnostic.openapi.v3.property) = {description: "更新者用户ID"}];
  optional uint32 deleted_by = 102 [json_name = "deletedBy", (gnostic.openapi.v3.property) = {description: "删除者用户ID"}];

  optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt", (gnostic.openapi.v3.property) = {description: "创建时间"}];
  optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt", (gnostic.openapi.v3.property) = {description: "更新时间"}];
  optional google.protobuf.Timestamp deleted_at = 202 [json_name = "deletedAt", (gnostic.openapi.v3.property) = {description: "删除时间"}];
}

message ListShippingAddressResponse { repeated ShippingAddress items = 1; uint64 total = 2; }
message CountShippingAddressResponse { uint64 count = 1; }

message GetShippingAddressRequest {
  oneof query_by {
    uint32 id = 1 [(gnostic.openapi.v3.property) = {description: "地址ID", read_only: true}, json_name = "id"];
  }
  optional google.protobuf.FieldMask view_mask = 100 [
    json_name = "viewMask",
    (gnostic.openapi.v3.property) = {description: "视图字段过滤器"}
  ];
}

message CreateShippingAddressRequest { ShippingAddress data = 1; }

message UpdateShippingAddressRequest {
  uint32 id = 1 [(gnostic.openapi.v3.property) = {description: "地址ID", read_only: true}, json_name = "id"];
  ShippingAddress data = 2;
  google.protobuf.FieldMask update_mask = 3 [
    (gnostic.openapi.v3.property) = {description: "要更新的字段列表"},
    json_name = "updateMask"
  ];
  optional bool allow_missing = 4 [
    (gnostic.openapi.v3.property) = {description: "允许缺失则插入"},
    json_name = "allowMissing"
  ];
}

message DeleteShippingAddressRequest {
  oneof query_by {
    uint32 id = 1 [(gnostic.openapi.v3.property) = {description: "地址ID", read_only: true}, json_name = "id"];
  }
}
