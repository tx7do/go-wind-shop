syntax = "proto3";

package tax.service.v1;

import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";

import "pagination/v1/pagination.proto";

// 税率规则服务（核心实现，gRPC）
service TaxRateService {
  rpc List (pagination.PagingRequest) returns (ListTaxRateResponse) {}
  rpc Count (pagination.PagingRequest) returns (CountTaxRateResponse) {}
  rpc Get (GetTaxRateRequest) returns (TaxRate) {}
  rpc Create (CreateTaxRateRequest) returns (google.protobuf.Empty) {}
  rpc Update (UpdateTaxRateRequest) returns (google.protobuf.Empty) {}
  rpc Delete (DeleteTaxRateRequest) returns (google.protobuf.Empty) {}
}

// 税率规则
message TaxRate {
  // 规则状态
  enum Status {
    STATUS_UNSPECIFIED = 0;
    ACTIVE = 1;          // 生效
    INACTIVE = 2;        // 停用
  }

  optional uint32 id = 1 [json_name = "id", (gnostic.openapi.v3.property) = {description: "规则ID"}];

  optional string region = 2 [
    json_name = "region",
    (gnostic.openapi.v3.property) = {description: "目的地区域（ISO 3166 国家代码）"}
  ];

  optional int32 tax_rate = 3 [
    json_name = "taxRate",
    (gnostic.openapi.v3.property) = {description: "税率百分比（0-100，如 20 表示 20% VAT）"}
  ];

  optional Status status = 4 [
    json_name = "status",
    (gnostic.openapi.v3.property) = {description: "规则状态"}
  ];

  // ===== 以下为 mixin 注入字段 =====

  optional string currency = 5 [
    json_name = "currency",
    (gnostic.openapi.v3.property) = {description: "币种（ISO 4217）"}
  ];

  // ===== 以下是 infra mixin 注入字段（高编号） =====

  optional uint32 tenant_id = 90 [json_name = "tenantId", (gnostic.openapi.v3.property) = {description: "租户ID"}];

  optional uint32 created_by = 100 [json_name = "createdBy", (gnostic.openapi.v3.property) = {description: "创建者用户ID"}];
  optional uint32 updated_by = 101 [json_name = "updatedBy", (gnostic.openapi.v3.property) = {description: "更新者用户ID"}];
  optional uint32 deleted_by = 102 [json_name = "deletedBy", (gnostic.openapi.v3.property) = {description: "删除者用户ID"}];

  optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt", (gnostic.openapi.v3.property) = {description: "创建时间"}];
  optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt", (gnostic.openapi.v3.property) = {description: "更新时间"}];
  optional google.protobuf.Timestamp deleted_at = 202 [json_name = "deletedAt", (gnostic.openapi.v3.property) = {description: "删除时间"}];
}

message ListTaxRateResponse { repeated TaxRate items = 1; uint64 total = 2; }

message GetTaxRateRequest {
  oneof query_by {
    uint32 id = 1 [(gnostic.openapi.v3.property) = {description: "ID", read_only: true}, json_name = "id"];
  }
  optional google.protobuf.FieldMask view_mask = 100 [
    json_name = "viewMask",
    (gnostic.openapi.v3.property) = {description: "视图字段过滤器"}
  ];
}

message CreateTaxRateRequest { TaxRate data = 1; }
message UpdateTaxRateRequest {
  uint32 id = 1;
  TaxRate data = 2;
  google.protobuf.FieldMask update_mask = 3 [
    (gnostic.openapi.v3.property) = {description: "要更新的字段列表"},
    json_name = "updateMask"
  ];
  optional bool allow_missing = 4 [
    (gnostic.openapi.v3.property) = {description: "允许缺失则插入"},
    json_name = "allowMissing"
  ];
}
message DeleteTaxRateRequest {
  oneof query_by {
    uint32 id = 1 [(gnostic.openapi.v3.property) = {description: "ID", read_only: true}, json_name = "id"];
  }
}
message CountTaxRateResponse { uint64 count = 1; }
