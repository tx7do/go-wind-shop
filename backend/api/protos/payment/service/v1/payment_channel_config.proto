syntax = "proto3";

package payment.service.v1;

import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";

import "pagination/v1/pagination.proto";

// 支付渠道配置服务（平台/租户维度的网关接入配置；凭据仅服务端持有）
service PaymentChannelConfigService {
  rpc List (pagination.PagingRequest) returns (ListPaymentChannelConfigResponse) {}
  rpc Count (pagination.PagingRequest) returns (CountPaymentChannelConfigResponse) {}
  rpc Get (GetPaymentChannelConfigRequest) returns (PaymentChannelConfig) {}
  rpc Create (CreatePaymentChannelConfigRequest) returns (google.protobuf.Empty) {}
  rpc Update (UpdatePaymentChannelConfigRequest) returns (google.protobuf.Empty) {}
  rpc Delete (DeletePaymentChannelConfigRequest) returns (google.protobuf.Empty) {}

  // 当前启用渠道（C 端结算页选择用；不含任何凭据字段）
  rpc ListEnabledChannels (ListEnabledChannelsRequest) returns (ListEnabledChannelsResponse) {}

  // 按渠道类型解析一条启用渠道并解密凭据（BFF 网关回调验签用，服务间内网）。
  // 同类型启用渠道多条时取 updated_at 最新一条。
  rpc ResolveEnabledChannel (ResolveEnabledChannelRequest) returns (PaymentChannelConfig) {}
}

// 支付渠道类型
//
// 合规约束（代码交付物定位）：仅提供「部署方自带资质」的直连商户模式适配器——
// 交易资金由支付渠道直接清算给部署方自己的商户号，本系统不归集、不经手、
// 不二次分配任何交易资金。多商户平台化（资金归集/分账）必须另行接入持牌
// 机构分账产品，本枚举不提供该形态。
enum PaymentChannelType {
  PAYMENT_CHANNEL_UNSPECIFIED = 0;

  // 模拟渠道：开发/演示用，不出真实资金；默认停用，生产部署应保持停用
  PAYMENT_CHANNEL_MOCK = 1;

  // 微信支付 Native（扫码支付，直连商户）
  PAYMENT_CHANNEL_WECHAT_NATIVE = 2;

  // 微信支付 H5（移动端浏览器跳转支付，直连商户）
  PAYMENT_CHANNEL_WECHAT_H5 = 4;

  // 支付宝电脑网站支付（page pay，直连商户）
  PAYMENT_CHANNEL_ALIPAY_PAGE = 3;
}

// 支付渠道配置
message PaymentChannelConfig {
  optional uint32 id = 1 [json_name = "id", (gnostic.openapi.v3.property) = {description: "渠道配置ID"}];

  optional string name = 2 [
    json_name = "name",
    (gnostic.openapi.v3.property) = {description: "渠道显示名"}
  ];

  optional PaymentChannelType channel = 3 [
    json_name = "channel",
    (gnostic.openapi.v3.property) = {description: "渠道类型"}
  ];

  // 渠道应用 ID（微信 appid / 支付宝 app_id）
  optional string app_id = 4 [
    json_name = "appId",
    (gnostic.openapi.v3.property) = {description: "渠道应用ID"}
  ];

  // 商户号（微信 mch_id；支付宝直连可空）
  optional string mch_id = 5 [
    json_name = "mchId",
    (gnostic.openapi.v3.property) = {description: "商户号"}
  ];

  // 沙箱模式：true 走渠道沙箱网关（开发/验收）；生产部署必须为 false
  optional bool sandbox = 6 [
    json_name = "sandbox",
    (gnostic.openapi.v3.property) = {description: "沙箱模式"}
  ];

  // 启用：仅启用的渠道出现在 C 端结算页
  optional bool enabled = 7 [
    json_name = "enabled",
    (gnostic.openapi.v3.property) = {description: "是否启用"}
  ];

  // 网关凭据（写-only）：渠道所需密钥的 JSON，落库前服务端 AES-GCM 加密。
  // 读取路径永不回填本字段（Get/List 恒为空），改密钥 = 提交新值。
  // 微信 Native：{"mchCertSerialNo":"...","apiV3Key":"...","privateKeyPem":"..."}
  // 支付宝 Page：{"privateKey":"...","alipayPublicKey":"..."}
  optional string credentials = 8 [
    json_name = "credentials",
    (gnostic.openapi.v3.property) = {description: "网关凭据JSON（写入专用，读取恒空）"}
  ];

  // 凭据是否已配置（读路径计算字段；替代直接暴露凭据内容）
  optional bool credentials_configured = 9 [
    json_name = "credentialsConfigured",
    (gnostic.openapi.v3.property) = {description: "凭据是否已配置"}
  ];

  optional string remark = 10 [
    json_name = "remark",
    (gnostic.openapi.v3.property) = {description: "备注"}
  ];

  // ===== infra mixin 注入字段（高编号） =====

  optional uint32 tenant_id = 90 [json_name = "tenantId", (gnostic.openapi.v3.property) = {description: "租户ID"}];

  optional uint32 created_by = 100 [json_name = "createdBy", (gnostic.openapi.v3.property) = {description: "创建者用户ID"}];
  optional uint32 updated_by = 101 [json_name = "updatedBy", (gnostic.openapi.v3.property) = {description: "更新者用户ID"}];

  optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt", (gnostic.openapi.v3.property) = {description: "创建时间"}];
  optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt", (gnostic.openapi.v3.property) = {description: "更新时间"}];
}

// C 端可见渠道（公开视图：仅展示字段，无任何配置/凭据细节）
message PaymentChannel {
  optional uint32 id = 1 [json_name = "id", (gnostic.openapi.v3.property) = {description: "渠道配置ID"}];
  optional string name = 2 [json_name = "name", (gnostic.openapi.v3.property) = {description: "渠道显示名"}];
  optional PaymentChannelType channel = 3 [json_name = "channel", (gnostic.openapi.v3.property) = {description: "渠道类型"}];
  optional bool sandbox = 4 [json_name = "sandbox", (gnostic.openapi.v3.property) = {description: "沙箱模式"}];
}

message ListPaymentChannelConfigResponse { repeated PaymentChannelConfig items = 1; uint64 total = 2; }
message CountPaymentChannelConfigResponse { uint64 count = 1; }

message GetPaymentChannelConfigRequest {
  uint32 id = 1 [(gnostic.openapi.v3.property) = {description: "ID", read_only: true}, json_name = "id"];
  optional google.protobuf.FieldMask view_mask = 100 [
    json_name = "viewMask",
    (gnostic.openapi.v3.property) = {description: "查看字段掩码"}
  ];
}

message CreatePaymentChannelConfigRequest { PaymentChannelConfig data = 1; }

message UpdatePaymentChannelConfigRequest {
  uint32 id = 1;
  PaymentChannelConfig data = 2;
  optional google.protobuf.FieldMask update_mask = 3;
  optional bool allow_missing = 4 [
    json_name = "allowMissing",
    (gnostic.openapi.v3.property) = {description: "不存在时自动创建"}
  ];
}

message DeletePaymentChannelConfigRequest {
  uint32 id = 1 [(gnostic.openapi.v3.property) = {description: "ID", read_only: true}, json_name = "id"];
}

message ListEnabledChannelsRequest {}
message ListEnabledChannelsResponse { repeated PaymentChannel items = 1; }

message ResolveEnabledChannelRequest {
  PaymentChannelType channel = 1 [(gnostic.openapi.v3.property) = {description: "渠道类型"}];
}
