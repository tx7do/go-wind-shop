syntax = "proto3";

package comment.service.v1;

import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";

import "pagination/v1/pagination.proto";

// 商品评论服务
service CommentService {
  // 获取评论列表
  rpc List (pagination.PagingRequest) returns (ListCommentResponse) {}

  // 统计评论数量
  rpc Count (pagination.PagingRequest) returns (CountCommentResponse) {}

  // 获取评论数据
  rpc Get (GetCommentRequest) returns (Comment) {}

  // 创建评论
  rpc Create (CreateCommentRequest) returns (google.protobuf.Empty) {}

  // 更新评论
  rpc Update (UpdateCommentRequest) returns (google.protobuf.Empty) {}

  // 删除评论
  rpc Delete (DeleteCommentRequest) returns (google.protobuf.Empty) {}

  // 获取商品评分聚合（AVG + COUNT over 已批准评论）
  rpc GetProductRating (GetProductRatingRequest) returns (ProductRatingSummary) {}
}

// 商品评论
message Comment {
  // 评论状态
  enum Status {
    STATUS_UNSPECIFIED = 0;

    STATUS_PENDING = 1;   // 待审核
    STATUS_APPROVED = 2;  // 已批准
    STATUS_REJECTED = 3;  // 已拒绝
    STATUS_SPAM = 4;      // 垃圾评论
  }

  // 内容类型
  enum ContentType {
    CONTENT_TYPE_UNSPECIFIED = 0;

    CONTENT_TYPE_PRODUCT = 1; // 产品
  }

  optional uint32 id = 1 [
    json_name = "id",
    (gnostic.openapi.v3.property) = {description: "评论ID"}
  ];  // 评论ID

  optional ContentType content_type = 2 [
    json_name = "contentType",
    (gnostic.openapi.v3.property) = {description: "内容类型"}
  ]; // 内容类型（仅产品）

  optional uint32 object_id = 3 [
    json_name = "objectId",
    (gnostic.openapi.v3.property) = {description: "对象ID"}
  ]; // 对象ID（商品ID，配合 content_type 使用）

  optional string content = 4 [
    json_name = "content",
    (gnostic.openapi.v3.property) = {description: "评论内容"}
  ]; // 评论内容

  optional Status status = 5 [
    json_name = "status",
    (gnostic.openapi.v3.property) = {description: "评论状态"}
  ]; // 评论状态

  optional uint32 rating = 6 [
    json_name = "rating",
    (gnostic.openapi.v3.property) = {description: "评分1-5"}
  ]; // 评分（1-5，仅顶级评论可携带，回复无意义）

  optional uint32 parent_id = 500 [json_name = "parentId", (gnostic.openapi.v3.property) = {description: "父节点ID"}];  // 父节点ID
  repeated Comment children = 501 [json_name = "children", (gnostic.openapi.v3.property) = {description: "子节点树"}];  // 子节点树

  optional uint32 tenant_id = 12 [json_name = "tenantId", (gnostic.openapi.v3.property) = {description: "租户ID"}];  // 租户ID

  optional uint32 created_by = 510 [json_name = "createdBy", (gnostic.openapi.v3.property) = {description: "创建者用户ID"}]; // 创建者用户ID
  optional uint32 updated_by = 511 [json_name = "updatedBy", (gnostic.openapi.v3.property) = {description: "更新者用户ID"}]; // 更新者用户ID
  optional uint32 deleted_by = 512 [json_name = "deletedBy", (gnostic.openapi.v3.property) = {description: "删除者用户ID"}]; // 删除者用户ID

  optional google.protobuf.Timestamp created_at = 520 [json_name = "createdAt", (gnostic.openapi.v3.property) = {description: "创建时间"}];// 创建时间
  optional google.protobuf.Timestamp updated_at = 521 [json_name = "updatedAt", (gnostic.openapi.v3.property) = {description: "更新时间"}];// 更新时间
  optional google.protobuf.Timestamp deleted_at = 522 [json_name = "deletedAt", (gnostic.openapi.v3.property) = {description: "删除时间"}];// 删除时间
}

// 回应 - 评论列表
message ListCommentResponse {
  repeated Comment items = 1;
  uint64 total = 2;
}

// 请求 - 评论数据
message GetCommentRequest {
  oneof query_by {
    uint32 id = 1 [
      (gnostic.openapi.v3.property) = {description: "ID", read_only: true},
      json_name = "id"
    ]; // ID
  }

  optional google.protobuf.FieldMask view_mask = 100 [
    json_name = "viewMask",
    (gnostic.openapi.v3.property) = {
      description: "视图字段过滤器，用于控制返回的字段"
    }
  ]; // 视图字段过滤器，用于控制返回的字段
}

// 请求 - 创建评论
message CreateCommentRequest {
  Comment data = 1;
}

// 请求 - 更新评论
message UpdateCommentRequest {
  uint32 id = 1;

  Comment data = 2;

  google.protobuf.FieldMask update_mask = 3 [
    (gnostic.openapi.v3.property) = {
      description: "要更新的字段列表"
    },
    json_name = "updateMask"
  ]; // 要更新的字段列表

  optional bool allow_missing = 4 [
    (gnostic.openapi.v3.property) = {description: "允许缺失则插入"},
    json_name = "allowMissing"
  ]; // 如果设置为true的时候，资源不存在则会新增(插入)，并且在这种情况下`updateMask`字段将会被忽略。
}

// 请求 - 删除评论
message DeleteCommentRequest {
  oneof query_by {
    uint32 id = 1 [
      (gnostic.openapi.v3.property) = {description: "ID", read_only: true},
      json_name = "id"
    ]; // ID
  }
}

message CountCommentResponse {
  uint64 count = 1;
}

// 请求 - 商品评分聚合
message GetProductRatingRequest {
  uint32 product_id = 1 [json_name = "productId", (gnostic.openapi.v3.property) = {description: "商品ID"}];
}

// 响应 - 商品评分聚合（仅统计已批准评论）
message ProductRatingSummary {
  double average = 1 [json_name = "average", (gnostic.openapi.v3.property) = {description: "平均评分（0-5，无评分时为0）"}];
  uint64 count = 2 [json_name = "count", (gnostic.openapi.v3.property) = {description: "已批准评分数（含无评分的评论）"}];
}
