syntax = "proto3";

package shipping.service.v1;

import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";

import "pagination/v1/pagination.proto";

// 运费模板服务（核心实现，gRPC）
service ShippingRateService {
  rpc List (pagination.PagingRequest) returns (ListShippingRateResponse) {}
  rpc Count (pagination.PagingRequest) returns (CountShippingRateResponse) {}
  rpc Get (GetShippingRateRequest) returns (ShippingRate) {}
  rpc Create (CreateShippingRateRequest) returns (google.protobuf.Empty) {}
  rpc Update (UpdateShippingRateRequest) returns (google.protobuf.Empty) {}
  rpc Delete (DeleteShippingRateRequest) returns (google.protobuf.Empty) {}
}

// 运费模板
message ShippingRate {
  // 模板状态
  enum Status {
    STATUS_UNSPECIFIED = 0;
    ACTIVE = 1;          // 生效
    INACTIVE = 2;        // 停用
  }

  optional uint32 id = 1 [json_name = "id", (gnostic.openapi.v3.property) = {description: "模板ID"}];

  optional string region = 2 [
    json_name = "region",
    (gnostic.openapi.v3.property) = {description: "目的地区域（ISO 3166 国家代码）"}
  ];

  optional int64 base_fee = 3 [
    json_name = "baseFee",
    (gnostic.openapi.v3.property) = {description: "基础运费（最小货币单位，分）"}
  ];

  optional int64 per_unit_fee = 4 [
    json_name = "perUnitFee",
    (gnostic.openapi.v3.property) = {description: "按订单项数加收的运费（最小货币单位，分/件）"}
  ];

  optional Status status = 5 [
    json_name = "status",
    (gnostic.openapi.v3.property) = {description: "模板状态"}
  ];

  // ===== 以下为 mixin 注入字段 =====

  optional string currency = 6 [
    json_name = "currency",
    (gnostic.openapi.v3.property) = {description: "币种（ISO 4217）"}
  ];

  // ===== 以下是 infra mixin 注入字段（高编号） =====

  optional uint32 tenant_id = 90 [json_name = "tenantId", (gnostic.openapi.v3.property) = {description: "租户ID"}];

  optional uint32 created_by = 100 [json_name = "createdBy", (gnostic.openapi.v3.property) = {description: "创建者用户ID"}];
  optional uint32 updated_by = 101 [json_name = "updatedBy", (gnostic.openapi.v3.property) = {description: "更新者用户ID"}];
  optional uint32 deleted_by = 102 [json_name = "deletedBy", (gnostic.openapi.v3.property) = {description: "删除者用户ID"}];

  optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt", (gnostic.openapi.v3.property) = {description: "创建时间"}];
  optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt", (gnostic.openapi.v3.property) = {description: "更新时间"}];
  optional google.protobuf.Timestamp deleted_at = 202 [json_name = "deletedAt", (gnostic.openapi.v3.property) = {description: "删除时间"}];
}

message ListShippingRateResponse { repeated ShippingRate items = 1; uint64 total = 2; }

message GetShippingRateRequest {
  oneof query_by {
    uint32 id = 1 [(gnostic.openapi.v3.property) = {description: "ID", read_only: true}, json_name = "id"];
  }
  optional google.protobuf.FieldMask view_mask = 100 [
    json_name = "viewMask",
    (gnostic.openapi.v3.property) = {description: "视图字段过滤器"}
  ];
}

message CreateShippingRateRequest { ShippingRate data = 1; }
message UpdateShippingRateRequest {
  uint32 id = 1;
  ShippingRate data = 2;
  google.protobuf.FieldMask update_mask = 3 [
    (gnostic.openapi.v3.property) = {description: "要更新的字段列表"},
    json_name = "updateMask"
  ];
  optional bool allow_missing = 4 [
    (gnostic.openapi.v3.property) = {description: "允许缺失则插入"},
    json_name = "allowMissing"
  ];
}
message DeleteShippingRateRequest {
  oneof query_by {
    uint32 id = 1 [(gnostic.openapi.v3.property) = {description: "ID", read_only: true}, json_name = "id"];
  }
}
message CountShippingRateResponse { uint64 count = 1; }
