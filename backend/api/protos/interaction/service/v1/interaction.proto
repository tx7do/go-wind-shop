syntax = "proto3";

package interaction.service.v1;

// 交互服务（评论点赞计数内聚子系统）
//
// 作为点赞计数的唯一写入方，集中管理 ledger 记录及 interaction_counter 表的
// 计数 upsert。comment 表上的散落计数列已移除，计数统一存于 counter 表。
// viewer 用户身份由鉴权上下文注入，请求体不接受 user_id。
//
// 注意：shop 无 post/watch，仅支持 comment like。
service InteractionService {
  // 点赞 comment。幂等：已点赞则 no-op。
  rpc Like (LikeRequest) returns (LikeResponse) {}

  // 取消点赞 comment。幂等：未点赞则 no-op。
  rpc Unlike (LikeRequest) returns (LikeResponse) {}

  // 批量查询当前 viewer 对指定评论的点赞状态（供前端渲染按钮态，不含计数）。
  rpc GetInteractionStatus (GetInteractionStatusRequest) returns (GetInteractionStatusResponse) {}

  // 批量查询指定评论的计数。供前端列表/详情渲染计数展示。
  rpc GetCounts (GetCountsRequest) returns (GetCountsResponse) {}
}

// 交互管理服务（运营清数据面）
//
// 与 viewer-facing 的 InteractionService 相对，本服务面向后台运营，接受
// target_id / user_id 作为入参，身份从运营上下文（OperatorMetadata）取，
// 调用方须为平台管理员（IsPlatformContext || IsSystemContext）。
// 每次操作写 OperationAuditLog。
service InteractionAdminService {
  // 清除单条评论上的全部点赞 ledger，并同步把对应 interaction_counter 行归零删除。
  rpc PurgeTargetInteractions (PurgeTargetInteractionsRequest) returns (PurgeTargetInteractionsResponse) {}

  // 清除指定用户在全站的全部点赞 ledger（分批短事务），每批同步回滚对应 counter。
  // 用于封禁/注销场景。
  rpc PurgeUserInteractions (PurgeUserInteractionsRequest) returns (PurgeUserInteractionsResponse) {}

  // 按 ledger 真实计数重算指定 (target, metric) 的 interaction_counter 行，
  // 用于修复计数漂移。recount==0 时删行。
  rpc ResetCounter (ResetCounterRequest) returns (ResetCounterResponse) {}
}

// 交互目标类型
enum TargetType {
  TARGET_TYPE_UNSPECIFIED = 0;
  TARGET_TYPE_COMMENT = 1;
}

// 计数指标类型。与 interaction_counter 表的 metric 列对应。
enum CounterMetric {
  COUNTER_METRIC_UNSPECIFIED = 0;
  COUNTER_METRIC_LIKE = 1;
}

message LikeRequest {
  TargetType target_type = 1;
  uint32 target_id = 2;
}

message LikeResponse {
  bool liked = 1;       // 操作后的当前点赞状态
  int32 like_count = 2; // 操作后的最新点赞计数
}

message GetInteractionStatusRequest {
  TargetType target_type = 1;
  repeated uint32 target_ids = 2;
}

message InteractionStatus {
  bool liked = 1;
}

message GetInteractionStatusResponse {
  map<uint32, InteractionStatus> statuses = 1;
}

// 单个 (target, metric) 的计数条目。用于 GetCountsResponse 的内层结构。
// 注意：proto3 不允许枚举类型作 map key，故内层用 repeated MetricCount 而非 map<CounterMetric,int64>。
message MetricCount {
  CounterMetric metric = 1;
  int64 count = 2;
}

// 单个目标下所有请求 metric 的计数集合。
message CountMap {
  repeated MetricCount counts = 1;
}

message GetCountsRequest {
  TargetType target_type = 1;
  repeated uint32 target_ids = 2;
  repeated CounterMetric metrics = 3;
}

// target_id → 该目标下各 metric 的计数集合。
// 未在 counter 表中记录的 (target, metric) 组合不出现在响应中，前端按 0 兜底。
message GetCountsResponse {
  map<uint32, CountMap> counts = 1;
}

// ===== 清数据请求/响应 =====

message PurgeTargetInteractionsRequest {
  TargetType target_type = 1;
  uint32 target_id = 2;
}

message PurgeTargetInteractionsResponse {
  uint32 affected_rows = 1; // 被删除的 ledger 行数
}

message PurgeUserInteractionsRequest {
  uint32 user_id = 1;
}

message PurgeUserInteractionsResponse {
  uint32 affected_rows = 1; // 被删除的 ledger 行数
}

message ResetCounterRequest {
  TargetType target_type = 1;
  uint32 target_id = 2;
  CounterMetric metric = 3;
}

message ResetCounterResponse {
  int64 recount = 1; // 按 ledger 重算后的真实计数
}
