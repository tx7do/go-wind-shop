syntax = "proto3";

package app.service.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "pagination/v1/pagination.proto";

import "comment/service/v1/comment.proto";

// 商品评论前台服务。
// List/Get 在 BFF 层过滤 STATUS_APPROVED（未审核/拒绝/垃圾对前台不可见）；
// Create 注入 CreatedBy（防作者伪造）；Update/Delete 做 ensureCommentOwner（IDOR 防护）；
// 用户隔离由 BFF fail-closed 注入 user_id + core UserPrivacy 行级隔离双重保障。
service CommentService {
  rpc List (pagination.PagingRequest) returns (comment.service.v1.ListCommentResponse) {
    option (google.api.http) = {
      get: "/app/v1/mall/comments"
    };
  }

  rpc Get (comment.service.v1.GetCommentRequest) returns (comment.service.v1.Comment) {
    option (google.api.http) = {
      get: "/app/v1/mall/comments/{id}"
    };
  }

  rpc Create (comment.service.v1.CreateCommentRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/app/v1/mall/comments"
      body: "*"
    };
  }

  rpc Update (comment.service.v1.UpdateCommentRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/app/v1/mall/comments/{id}"
      body: "*"
    };
  }

  rpc Delete (comment.service.v1.DeleteCommentRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/app/v1/mall/comments"
    };
  }
}
