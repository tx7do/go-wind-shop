syntax = "proto3";

package app.service.v1;

import "google/api/annotations.proto";

import "ai/service/v1/ai_chat.proto";

// AI 导购对话服务（C端）
//
// 流式语义：本 RPC 是普通 POST（body 为扁平请求体，不包 data）。
// BFF 消费 core 的 ChatStreamFrame 流：C端当前以同步响应为主——done 帧
// （完整回复）作为 POST 响应返回；chunk/tool 帧经 SSE 网关的
// `ai_chat_chunk` / `ai_chat_tool` 事件推给在线用户（未连接 SSE 时静默丢弃，
// 不影响对话完整性）。
service AiChatService {
  // 发起一轮导购对话
  rpc Chat (ai.service.v1.ChatRequest) returns (ai.service.v1.ChatResponse) {
    option (google.api.http) = {
      post: "/app/v1/ai/chat/completions"
      body: "*"
    };
  }

  // 搜索查询 AI 改写（匿名可用——白名单登记；LLM 生成，输入钳制 100 字符）。
  // 自然语言搜索需求 → 2-4 个检索关键词，供 OpenSearch 全文检索使用；
  // 输入过短（已是高效关键词）或 LLM 失败时 rewritten=false，前端沿用原词。
  rpc RewriteSearchQuery (RewriteSearchQueryRequest) returns (RewriteSearchQueryResponse) {
    option (google.api.http) = {
      post: "/app/v1/ai/search/rewrite"
      body: "*"
    };
  }
}

// 搜索查询改写 - 请求
message RewriteSearchQueryRequest {
  string query = 1; // 用户原始搜索输入（≤100 字符）
}

// 搜索查询改写 - 响应
message RewriteSearchQueryResponse {
  repeated string keywords = 1; // 改写后的检索关键词（2-4 个）
  bool rewritten = 2;           // 是否完成改写（无需改写/失败为 false）
}
