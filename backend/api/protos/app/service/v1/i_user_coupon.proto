syntax = "proto3";

package app.service.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "pagination/v1/pagination.proto";

import "coupon/service/v1/coupon.proto";

// 用户优惠券前台服务（裁剪版：仅 List/Get/Quote + Claim 领取）。
// 无 Create/Update/Delete（admin 分配制不可对买家暴露）。
// List 由 BFF fail-closed 注入 user_id + core UserPrivacy 行级隔离双重保障。
// Claim 的 user_id 由 core 从 viewer 强制（BFF 只透传 template_id），事务内 ForUpdate 原子校验限领。
// Quote 试算不持锁不落库，最终抵扣以下单时事务内校验为准。
service UserCouponService {
  rpc List (pagination.PagingRequest) returns (coupon.service.v1.ListUserCouponResponse) {
    option (google.api.http) = {
      get: "/app/v1/mall/user-coupons"
    };
  }

  rpc Get (coupon.service.v1.GetUserCouponRequest) returns (coupon.service.v1.UserCoupon) {
    option (google.api.http) = {
      get: "/app/v1/mall/user-coupons/{id}"
    };
  }

  rpc Quote (coupon.service.v1.QuoteRequest) returns (coupon.service.v1.QuoteResponse) {
    option (google.api.http) = {
      post: "/app/v1/mall/user-coupons/quote"
      body: "*"
    };
  }

  // 领取公开可领模板。强制 auth（不入白名单）。
  rpc Claim (coupon.service.v1.ClaimCouponRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/app/v1/mall/user-coupons/claim"
      body: "*"
    };
  }
}
