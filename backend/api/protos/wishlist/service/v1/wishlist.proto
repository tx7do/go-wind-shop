syntax = "proto3";

package wishlist.service.v1;

import "gnostic/openapi/v3/annotations.proto";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

import "pagination/v1/pagination.proto";

// 收藏夹服务（裁剪版：仅 List/Create/Delete）。
// user_id 由后端 UserPrivacy 隐私层在 Create 时强制覆盖为当前 viewer，
// 并在 List/Delete 注入 user_id=viewer 过滤；客户端传入的 userId 写入值被忽略。
service WishlistService {
  rpc List (pagination.PagingRequest) returns (ListWishlistResponse) {}
  rpc Create (CreateWishlistRequest) returns (google.protobuf.Empty) {}
  rpc Delete (DeleteWishlistRequest) returns (google.protobuf.Empty) {}
}

// 收藏项
message Wishlist {
  optional uint32 id = 1 [json_name = "id", (gnostic.openapi.v3.property) = {description: "收藏项ID"}];
  optional uint32 user_id = 2 [json_name = "userId", (gnostic.openapi.v3.property) = {description: "用户ID（由隐私层强制，不可伪造）"}];
  optional uint32 product_id = 3 [json_name = "productId", (gnostic.openapi.v3.property) = {description: "关联的商品ID"}];
  optional uint32 tenant_id = 90 [json_name = "tenantId", (gnostic.openapi.v3.property) = {description: "租户ID"}];
  optional uint32 created_by = 100 [json_name = "createdBy", (gnostic.openapi.v3.property) = {description: "创建者用户ID"}];
  optional uint32 updated_by = 101 [json_name = "updatedBy", (gnostic.openapi.v3.property) = {description: "更新者用户ID"}];
  optional uint32 deleted_by = 102 [json_name = "deletedBy", (gnostic.openapi.v3.property) = {description: "删除者用户ID"}];
  optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt", (gnostic.openapi.v3.property) = {description: "创建时间"}];
  optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt", (gnostic.openapi.v3.property) = {description: "更新时间"}];
  optional google.protobuf.Timestamp deleted_at = 202 [json_name = "deletedAt", (gnostic.openapi.v3.property) = {description: "删除时间"}];
}

message ListWishlistResponse { repeated Wishlist items = 1; uint64 total = 2; }

message CreateWishlistRequest { Wishlist data = 1; }

message DeleteWishlistRequest {
  oneof query_by {
    uint32 id = 1 [(gnostic.openapi.v3.property) = {description: "ID", read_only: true}, json_name = "id"];
  }
}
