syntax = "proto3";

package catalog.service.v1;

import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";

import "pagination/v1/pagination.proto";

// 秒杀活动服务
//
// SKU 级限时限量抢购：秒杀价直接覆盖 SKU 结算单价（优先级高于促销专价），
// total_stock 为秒杀总限量（与 SKU 零售库存独立），per_user_limit 限每用户
// 在活动窗口内的累计购买量。下单事务内行锁扣减 sold_count，防超卖。
service SeckillActivityService {
  rpc List (pagination.PagingRequest) returns (ListSeckillActivityResponse) {}
  rpc Count (pagination.PagingRequest) returns (CountSeckillActivityResponse) {}
  rpc Get (GetSeckillActivityRequest) returns (SeckillActivity) {}
  rpc Create (CreateSeckillActivityRequest) returns (google.protobuf.Empty) {}
  rpc Update (UpdateSeckillActivityRequest) returns (google.protobuf.Empty) {}
  rpc Delete (DeleteSeckillActivityRequest) returns (google.protobuf.Empty) {}

  // 当前生效中的秒杀（status=ACTIVE 且处于有效窗口且未售罄；租户由隐私层注入）。
  // 供 C 端商品页秒杀价角标/倒计时使用。
  rpc ListActiveSeckills (ListActiveSeckillsRequest) returns (ListSeckillActivityResponse) {}
}

// 秒杀活动
message SeckillActivity {
  // 活动状态
  enum Status {
    STATUS_UNSPECIFIED = 0;
    ACTIVE = 1;           // 生效
    INACTIVE = 2;         // 停用（运营 kill-switch）
  }

  optional uint32 id = 1 [json_name = "id", (gnostic.openapi.v3.property) = {description: "活动ID"}];

  optional string name = 2 [
    json_name = "name",
    (gnostic.openapi.v3.property) = {description: "活动名称"}
  ];

  optional uint32 sku_id = 3 [
    json_name = "skuId",
    (gnostic.openapi.v3.property) = {description: "秒杀 SKU ID"}
  ];

  optional int64 seckill_price = 4 [
    json_name = "seckillPrice",
    (gnostic.openapi.v3.property) = {description: "秒杀价（最小货币单位，分）"}
  ];

  optional int32 total_stock = 5 [
    json_name = "totalStock",
    (gnostic.openapi.v3.property) = {description: "秒杀总限量（件）"}
  ];

  optional int32 sold_count = 6 [
    json_name = "soldCount",
    (gnostic.openapi.v3.property) = {description: "已抢购件数"}
  ];

  optional int32 per_user_limit = 7 [
    json_name = "perUserLimit",
    (gnostic.openapi.v3.property) = {description: "每人限购件数（活动窗口内累计）"}
  ];

  optional int32 priority = 8 [
    json_name = "priority",
    (gnostic.openapi.v3.property) = {description: "优先级（同 SKU 并发活动取最高者）"}
  ];

  optional google.protobuf.Timestamp valid_from = 9 [
    json_name = "validFrom",
    (gnostic.openapi.v3.property) = {description: "生效时间"}
  ];

  optional google.protobuf.Timestamp valid_until = 10 [
    json_name = "validUntil",
    (gnostic.openapi.v3.property) = {description: "失效时间"}
  ];

  optional string currency = 11 [
    json_name = "currency",
    (gnostic.openapi.v3.property) = {description: "币种"}
  ];

  optional Status status = 12 [
    json_name = "status",
    (gnostic.openapi.v3.property) = {description: "活动状态"}
  ];

  // ===== 以下为 infra mixin 注入字段（高编号） =====

  optional uint32 tenant_id = 90 [json_name = "tenantId", (gnostic.openapi.v3.property) = {description: "租户ID"}];

  optional uint32 created_by = 100 [json_name = "createdBy", (gnostic.openapi.v3.property) = {description: "创建者用户ID"}];
  optional uint32 updated_by = 101 [json_name = "updatedBy", (gnostic.openapi.v3.property) = {description: "更新者用户ID"}];

  optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt", (gnostic.openapi.v3.property) = {description: "创建时间"}];
  optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt", (gnostic.openapi.v3.property) = {description: "更新时间"}];
}

message ListSeckillActivityResponse { repeated SeckillActivity items = 1; uint64 total = 2; }
message CountSeckillActivityResponse { uint64 count = 1; }

message GetSeckillActivityRequest {
  oneof query_by {
    uint32 id = 1 [(gnostic.openapi.v3.property) = {description: "ID", read_only: true}, json_name = "id"];
  }
  optional google.protobuf.FieldMask view_mask = 100 [
    json_name = "viewMask",
    (gnostic.openapi.v3.property) = {description: "查看字段掩码"}
  ];
}

message CreateSeckillActivityRequest { SeckillActivity data = 1; }

message UpdateSeckillActivityRequest {
  uint32 id = 1;
  SeckillActivity data = 2;
  optional google.protobuf.FieldMask update_mask = 3;
  optional bool allow_missing = 4 [
    json_name = "allowMissing",
    (gnostic.openapi.v3.property) = {description: "不存在时自动创建"}
  ];
}

message DeleteSeckillActivityRequest {
  uint32 id = 1 [(gnostic.openapi.v3.property) = {description: "ID", read_only: true}, json_name = "id"];
}

message ListActiveSeckillsRequest {}
