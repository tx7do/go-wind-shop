syntax = "proto3";

package catalog.service.v1;

import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";

import "pagination/v1/pagination.proto";

// 商品属性服务
service ProductAttributeService {
  rpc List (pagination.PagingRequest) returns (ListProductAttributeResponse) {}
  rpc Count (pagination.PagingRequest) returns (CountProductAttributeResponse) {}
  rpc Get (GetProductAttributeRequest) returns (ProductAttribute) {}
  rpc Create (CreateProductAttributeRequest) returns (google.protobuf.Empty) {}
  rpc BatchCreate (BatchCreateProductAttributesRequest) returns (google.protobuf.Empty) {}
  rpc Update (UpdateProductAttributeRequest) returns (google.protobuf.Empty) {}
  rpc Delete (DeleteProductAttributeRequest) returns (google.protobuf.Empty) {}

  rpc TranslationExists (ProductAttributeTranslationExistsRequest) returns (ProductAttributeTranslationExistsResponse) {}
  rpc GetTranslation (GetProductAttributeRequest) returns (ProductAttributeTranslation) {}
  rpc CreateTranslation (CreateProductAttributeTranslationRequest) returns (ProductAttributeTranslation) {}
  rpc UpdateTranslation (UpdateProductAttributeTranslationRequest) returns (ProductAttributeTranslation) {}
  rpc DeleteTranslation (DeleteProductAttributeTranslationRequest) returns (google.protobuf.Empty) {}
}

// 商品属性值服务
service ProductAttributeValueService {
  rpc List (pagination.PagingRequest) returns (ListProductAttributeValueResponse) {}
  rpc Count (pagination.PagingRequest) returns (CountProductAttributeValueResponse) {}
  rpc Get (GetProductAttributeValueRequest) returns (ProductAttributeValue) {}
  rpc Create (CreateProductAttributeValueRequest) returns (google.protobuf.Empty) {}
  rpc BatchCreate (BatchCreateProductAttributeValuesRequest) returns (google.protobuf.Empty) {}
  rpc Update (UpdateProductAttributeValueRequest) returns (google.protobuf.Empty) {}
  rpc Delete (DeleteProductAttributeValueRequest) returns (google.protobuf.Empty) {}

  rpc TranslationExists (ProductAttributeValueTranslationExistsRequest) returns (ProductAttributeValueTranslationExistsResponse) {}
  rpc GetTranslation (GetProductAttributeValueRequest) returns (ProductAttributeValueTranslation) {}
  rpc CreateTranslation (CreateProductAttributeValueTranslationRequest) returns (ProductAttributeValueTranslation) {}
  rpc UpdateTranslation (UpdateProductAttributeValueTranslationRequest) returns (ProductAttributeValueTranslation) {}
  rpc DeleteTranslation (DeleteProductAttributeValueTranslationRequest) returns (google.protobuf.Empty) {}
}

// ============ 商品属性 ============

message ProductAttribute {
  optional uint32 id = 1 [json_name = "id", (gnostic.openapi.v3.property) = {description: "属性ID"}];
  optional uint32 sort_order = 2 [json_name = "sortOrder", (gnostic.openapi.v3.property) = {description: "排序优先级"}];

  repeated ProductAttributeTranslation translations = 20 [json_name = "translations", (gnostic.openapi.v3.property) = {description: "多语言翻译列表"}];
  repeated string available_languages = 21 [json_name = "availableLanguages", (gnostic.openapi.v3.property) = {description: "可用的语言代码列表", example: {yaml: '["zh-CN", "en-US"]'}}];

  optional uint32 created_by = 100 [json_name = "createdBy", (gnostic.openapi.v3.property) = {description: "创建者用户ID"}];
  optional uint32 updated_by = 101 [json_name = "updatedBy", (gnostic.openapi.v3.property) = {description: "更新者用户ID"}];
  optional uint32 deleted_by = 102 [json_name = "deletedBy", (gnostic.openapi.v3.property) = {description: "删除者用户ID"}];
  optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt", (gnostic.openapi.v3.property) = {description: "创建时间"}];
  optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt", (gnostic.openapi.v3.property) = {description: "更新时间"}];
  optional google.protobuf.Timestamp deleted_at = 202 [json_name = "deletedAt", (gnostic.openapi.v3.property) = {description: "删除时间"}];
}

message ProductAttributeTranslation {
  optional uint32 id = 1 [json_name = "id", (gnostic.openapi.v3.property) = {description: "翻译记录ID"}];
  optional uint32 attribute_id = 2 [json_name = "attributeId", (gnostic.openapi.v3.property) = {description: "关联的属性ID"}];
  optional string language_code = 3 [json_name = "languageCode", (gnostic.openapi.v3.property) = {description: "语言代码"}];
  optional string name = 10 [json_name = "name", (gnostic.openapi.v3.property) = {description: "属性名称（如“颜色”“尺寸”）"}];
  optional uint32 created_by = 100 [json_name = "createdBy", (gnostic.openapi.v3.property) = {description: "创建者用户ID"}];
  optional uint32 updated_by = 101 [json_name = "updatedBy", (gnostic.openapi.v3.property) = {description: "更新者用户ID"}];
  optional uint32 deleted_by = 102 [json_name = "deletedBy", (gnostic.openapi.v3.property) = {description: "删除者用户ID"}];
  optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt", (gnostic.openapi.v3.property) = {description: "创建时间"}];
  optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt", (gnostic.openapi.v3.property) = {description: "更新时间"}];
  optional google.protobuf.Timestamp deleted_at = 202 [json_name = "deletedAt", (gnostic.openapi.v3.property) = {description: "删除时间"}];
}

message ListProductAttributeResponse { repeated ProductAttribute items = 1; uint64 total = 2; }
message GetProductAttributeRequest {
  oneof query_by {
    uint32 id = 1 [(gnostic.openapi.v3.property) = {description: "ID", read_only: true}, json_name = "id"];
  }
  optional string locale = 10 [json_name = "locale", (gnostic.openapi.v3.property) = {description: "语言代码"}];
  optional google.protobuf.FieldMask view_mask = 100 [json_name = "viewMask", (gnostic.openapi.v3.property) = {description: "视图字段过滤器"}];
}
message CreateProductAttributeRequest { ProductAttribute data = 1; }
message UpdateProductAttributeRequest {
  uint32 id = 1;
  ProductAttribute data = 2;
  google.protobuf.FieldMask update_mask = 3 [(gnostic.openapi.v3.property) = {description: "要更新的字段列表", example: {yaml : "id,realname,username"}}, json_name = "updateMask"];
  optional bool allow_missing = 4 [(gnostic.openapi.v3.property) = {description: "允许缺失则插入"}, json_name = "allowMissing"];
}
message DeleteProductAttributeRequest {
  oneof query_by {
    uint32 id = 1 [(gnostic.openapi.v3.property) = {description: "ID", read_only: true}, json_name = "id"];
  }
}
message BatchCreateProductAttributesRequest { repeated ProductAttribute items = 1; }
message BatchCreateProductAttributesResponse { repeated int32 created_ids = 1 [json_name = "createdIds", (gnostic.openapi.v3.property) = {description: "创建成功的属性ID列表"}]; }
message CountProductAttributeResponse { uint64 count = 1; }

message ProductAttributeTranslationExistsRequest {
  uint32 attribute_id = 1 [json_name = "attributeId", (gnostic.openapi.v3.property) = {description: "属性ID"}];
  string language_code = 2 [json_name = "languageCode", (gnostic.openapi.v3.property) = {description: "语言代码"}];
}
message ProductAttributeTranslationExistsResponse { bool exists = 1 [json_name = "exists", (gnostic.openapi.v3.property) = {description: "是否存在"}]; }
message CreateProductAttributeTranslationRequest { ProductAttributeTranslation data = 1; }
message UpdateProductAttributeTranslationRequest {
  uint32 id = 1;
  ProductAttributeTranslation data = 2;
  google.protobuf.FieldMask update_mask = 3 [(gnostic.openapi.v3.property) = {description: "要更新的字段列表", example: {yaml : "id,realname,username"}}, json_name = "updateMask"];
}
message DeleteProductAttributeTranslationRequest {
  oneof query_by {
    uint32 id = 1 [(gnostic.openapi.v3.property) = {description: "翻译记录ID", read_only: true}, json_name = "id"];
    ProductAttributeTranslationIdentifier identifier = 2 [(gnostic.openapi.v3.property) = {description: "属性ID与语言代码复合标识"}];
  }
}
message ProductAttributeTranslationIdentifier {
  uint32 attribute_id = 1 [json_name = "attributeId", (gnostic.openapi.v3.property) = {description: "属性ID"}];
  string language_code = 2 [json_name = "languageCode", (gnostic.openapi.v3.property) = {description: "语言代码"}];
}

// ============ 商品属性值 ============

message ProductAttributeValue {
  optional uint32 id = 1 [json_name = "id", (gnostic.openapi.v3.property) = {description: "属性值ID"}];
  optional uint32 attribute_id = 2 [json_name = "attributeId", (gnostic.openapi.v3.property) = {description: "所属属性ID"}];
  optional uint32 sort_order = 3 [json_name = "sortOrder", (gnostic.openapi.v3.property) = {description: "排序优先级"}];

  repeated ProductAttributeValueTranslation translations = 20 [json_name = "translations", (gnostic.openapi.v3.property) = {description: "多语言翻译列表"}];
  repeated string available_languages = 21 [json_name = "availableLanguages", (gnostic.openapi.v3.property) = {description: "可用的语言代码列表", example: {yaml: '["zh-CN", "en-US"]'}}];

  optional uint32 created_by = 100 [json_name = "createdBy", (gnostic.openapi.v3.property) = {description: "创建者用户ID"}];
  optional uint32 updated_by = 101 [json_name = "updatedBy", (gnostic.openapi.v3.property) = {description: "更新者用户ID"}];
  optional uint32 deleted_by = 102 [json_name = "deletedBy", (gnostic.openapi.v3.property) = {description: "删除者用户ID"}];
  optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt", (gnostic.openapi.v3.property) = {description: "创建时间"}];
  optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt", (gnostic.openapi.v3.property) = {description: "更新时间"}];
  optional google.protobuf.Timestamp deleted_at = 202 [json_name = "deletedAt", (gnostic.openapi.v3.property) = {description: "删除时间"}];
}

message ProductAttributeValueTranslation {
  optional uint32 id = 1 [json_name = "id", (gnostic.openapi.v3.property) = {description: "翻译记录ID"}];
  optional uint32 value_id = 2 [json_name = "valueId", (gnostic.openapi.v3.property) = {description: "关联的属性值ID"}];
  optional string language_code = 3 [json_name = "languageCode", (gnostic.openapi.v3.property) = {description: "语言代码"}];
  optional string display_name = 10 [json_name = "displayName", (gnostic.openapi.v3.property) = {description: "属性值显示名（如“红”“XL”）"}];
  optional uint32 created_by = 100 [json_name = "createdBy", (gnostic.openapi.v3.property) = {description: "创建者用户ID"}];
  optional uint32 updated_by = 101 [json_name = "updatedBy", (gnostic.openapi.v3.property) = {description: "更新者用户ID"}];
  optional uint32 deleted_by = 102 [json_name = "deletedBy", (gnostic.openapi.v3.property) = {description: "删除者用户ID"}];
  optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt", (gnostic.openapi.v3.property) = {description: "创建时间"}];
  optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt", (gnostic.openapi.v3.property) = {description: "更新时间"}];
  optional google.protobuf.Timestamp deleted_at = 202 [json_name = "deletedAt", (gnostic.openapi.v3.property) = {description: "删除时间"}];
}

message ListProductAttributeValueResponse { repeated ProductAttributeValue items = 1; uint64 total = 2; }
message GetProductAttributeValueRequest {
  oneof query_by {
    uint32 id = 1 [(gnostic.openapi.v3.property) = {description: "ID", read_only: true}, json_name = "id"];
  }
  optional string locale = 10 [json_name = "locale", (gnostic.openapi.v3.property) = {description: "语言代码"}];
  optional google.protobuf.FieldMask view_mask = 100 [json_name = "viewMask", (gnostic.openapi.v3.property) = {description: "视图字段过滤器"}];
}
message CreateProductAttributeValueRequest { ProductAttributeValue data = 1; }
message UpdateProductAttributeValueRequest {
  uint32 id = 1;
  ProductAttributeValue data = 2;
  google.protobuf.FieldMask update_mask = 3 [(gnostic.openapi.v3.property) = {description: "要更新的字段列表", example: {yaml : "id,realname,username"}}, json_name = "updateMask"];
  optional bool allow_missing = 4 [(gnostic.openapi.v3.property) = {description: "允许缺失则插入"}, json_name = "allowMissing"];
}
message DeleteProductAttributeValueRequest {
  oneof query_by {
    uint32 id = 1 [(gnostic.openapi.v3.property) = {description: "ID", read_only: true}, json_name = "id"];
  }
}
message BatchCreateProductAttributeValuesRequest { repeated ProductAttributeValue items = 1; }
message BatchCreateProductAttributeValuesResponse { repeated int32 created_ids = 1 [json_name = "createdIds", (gnostic.openapi.v3.property) = {description: "创建成功的属性值ID列表"}]; }
message CountProductAttributeValueResponse { uint64 count = 1; }

message ProductAttributeValueTranslationExistsRequest {
  uint32 value_id = 1 [json_name = "valueId", (gnostic.openapi.v3.property) = {description: "属性值ID"}];
  string language_code = 2 [json_name = "languageCode", (gnostic.openapi.v3.property) = {description: "语言代码"}];
}
message ProductAttributeValueTranslationExistsResponse { bool exists = 1 [json_name = "exists", (gnostic.openapi.v3.property) = {description: "是否存在"}]; }
message CreateProductAttributeValueTranslationRequest { ProductAttributeValueTranslation data = 1; }
message UpdateProductAttributeValueTranslationRequest {
  uint32 id = 1;
  ProductAttributeValueTranslation data = 2;
  google.protobuf.FieldMask update_mask = 3 [(gnostic.openapi.v3.property) = {description: "要更新的字段列表", example: {yaml : "id,realname,username"}}, json_name = "updateMask"];
}
message DeleteProductAttributeValueTranslationRequest {
  oneof query_by {
    uint32 id = 1 [(gnostic.openapi.v3.property) = {description: "翻译记录ID", read_only: true}, json_name = "id"];
    ProductAttributeValueTranslationIdentifier identifier = 2 [(gnostic.openapi.v3.property) = {description: "属性值ID与语言代码复合标识"}];
  }
}
message ProductAttributeValueTranslationIdentifier {
  uint32 value_id = 1 [json_name = "valueId", (gnostic.openapi.v3.property) = {description: "属性值ID"}];
  string language_code = 2 [json_name = "languageCode", (gnostic.openapi.v3.property) = {description: "语言代码"}];
}
