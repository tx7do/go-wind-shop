# shop.gowind.cloud —— C 端商城（Nuxt SSG 静态产物 + 同源反代）
#
# 同源路径分流（不开 api/sse 独立域名）：
#   /app/v1/  → app 后端 REST        127.0.0.1:10700
#   /events   → app SSE 网关         127.0.0.1:10701（AI 导购流式帧）
#   其余      → frontend/app/.output/public 静态产物
#
# TLS：443 段与 80 重定向段按 certbot 签发后的形态书写；若 shop 证书是与
# admin 合并签发的单一 lineage，把 ssl_certificate* 路径改成实际目录即可
# （先 `ls /etc/letsencrypt/live/` 核对）。

server {
    server_name shop.gowind.cloud;

    # nuxt generate 的产物目录（.output/public 拷贝到此处）
    root /var/www/go-wind-shop/app;
    index index.html;

    # 商品图等上传接口的请求体上限
    client_max_body_size 50m;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_vary on;

    # ── 同源 API ─────────────────────────────────────────────
    # ^~ 抑制下方 \.html$ 正则抢匹配（防 .html 结尾的接口路径误入静态分支）
    location ^~ /app/v1/ {
        proxy_pass http://127.0.0.1:10700;   # 不带 URI：原始路径原样透传
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 同源 SSE（AI 导购 chunk/tool 帧）─────────────────────
    # 关键：关缓冲 + 长读超时，否则帧被 nginx 攒着不吐、长连接被掐
    location ^~ /events {
        proxy_pass http://127.0.0.1:10701;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # ── 静态资源 ─────────────────────────────────────────────
    # 指纹化产物：永久缓存（文件名变即 URL 变）
    location ^~ /_nuxt/    { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location ^~ /_i18n/    { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location ^~ /demo-images/ { expires 7d; add_header Cache-Control "public"; try_files $uri =404; }

    # HTML 一律不缓存：语言壳/页面壳是深链接回退的落点，发布后必须立即生效
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # ── 语言壳深链接回退 ─────────────────────────────────────
    # /zh-CN/cart 等深链接落到 /zh-CN/index.html（两个语言壳必须真实存在于产物中）
    location /zh-CN/ { try_files $uri $uri/ /zh-CN/index.html; }
    location /en-US/ { try_files $uri $uri/ /en-US/index.html; }

    # 根路径：nuxt 生成的重定向页（→ /zh-CN/），其余未知路径 404
    location / {
        try_files $uri $uri/ =404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/shop.gowind.cloud/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/shop.gowind.cloud/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = shop.gowind.cloud) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name shop.gowind.cloud;
    listen 80;
    return 404; # managed by Certbot


}
