# admin.shop.gowind.cloud —— 管理后台（Vite 静态产物 + 同源反代）
#
# 同源路径分流（不开 api/sse 独立域名）：
#   /admin/v1/  → admin 后端 REST     127.0.0.1:10600
#   /events     → admin SSE 网关      127.0.0.1:10601（token 续期推送）
#   其余        → frontend/admin/dist 静态产物（SPA history 路由回退 index.html）
#
# TLS：文件末尾与 80 重定向段里 `# managed by Certbot` 标记的行为 certbot
# 所写，原样保留不影响续期；其余部分可随意改。

server {
    server_name admin.shop.gowind.cloud;

    # vite build 的产物目录（dist 拷贝到此处）
    root /var/www/go-wind-shop/admin;
    index index.html;

    client_max_body_size 50m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ── 同源 API ─────────────────────────────────────────────
    # ^~ 前缀：抑制下方资源正则抢匹配，接口路径永不落入静态分支
    location ^~ /admin/v1/ {
        proxy_pass http://127.0.0.1:10600;   # 不带 URI：原始路径原样透传
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 同源 SSE（token 续期/通知推送）───────────────────────
    # 关键：关缓冲 + 长读超时，否则帧被 nginx 攒着不吐、长连接被掐
    location ^~ /events {
        proxy_pass http://127.0.0.1:10601;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # 带内容 hash 的构建产物：长缓存（正则兜住任意目录下的资源）
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # 入口页不缓存，发版即生效（SPA 回退会内部重定向到这里）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/admin.shop.gowind.cloud/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/admin.shop.gowind.cloud/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = admin.shop.gowind.cloud) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name admin.shop.gowind.cloud;
    listen 80;
    return 404; # managed by Certbot


}
